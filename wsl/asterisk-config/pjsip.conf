[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

[6001]
type=endpoint
context=default
disallow=all
allow=ulaw
auth=6001
aors=6001

; These 4 help a LOT on WSL/NAT:
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[6001]
type=auth
auth_type=userpass
username=6001
password=1234

[6001]
type=aor
max_contacts=1
remove_existing=yes
